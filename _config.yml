# ---------------------------------------------------------------------------
# Mellowlight Journal
# ---------------------------------------------------------------------------

title: "Mellowlight Journal"
tagline: "Hochzeiten, Fotografie und alles dazwischen"
description: >-
  Das Journal von Mellowlight: ehrliche Antworten zur Hochzeitsplanung,
  echte Hochzeiten aus Unterfranken und ein Blick hinter unsere Fotografie.

url: "https://blog.mellowlight.de"
baseurl: ""

# The main site. Every internal link to mellowlight.de goes through this,
# so the domain is never hardcoded in a template.
main_site: "https://mellowlight.de"

lang: de
timezone: Europe/Berlin

# ---------------------------------------------------------------------------
# URLs
# ---------------------------------------------------------------------------
# The Journal lives on its own subdomain, so articles sit at the root:
# blog.mellowlight.de/wie-viel-zeit-braucht-eine-hochzeitsreportage/
# `:title` honours the `slug:` front matter when it is set, which is how
# authors get clean lowercase URLs without renaming files.

permalink: /:title/

# ---------------------------------------------------------------------------
# Content
# ---------------------------------------------------------------------------

defaults:
  - scope: { path: "", type: "posts" }
    values:
      layout: article
      author: mc-martin

# ---------------------------------------------------------------------------
# Taxonomy
# ---------------------------------------------------------------------------
# Category labels, descriptions and SEO copy live in _data/categories.yml.
# Posts reference categories by their key.

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    category: "/kategorie/:name/"
    tag: "/thema/:name/"

# A tag needs at least this many articles before it is indexed by search
# engines. Thinner tag pages still render and still work — they just carry
# noindex, so they cannot dilute the site.
tag_index_threshold: 3

paginate: 12
paginate_path: "/artikel/seite:num/"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

# Jekyll normally invents an excerpt from the first paragraph. That would make
# the standfirst repeat the opening line of every article, so it is switched
# off: `excerpt:` is empty unless an author actually writes one.
excerpt_separator: ""

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true            # required for the table of contents
  hard_wrap: false
  smart_quotes: ["sbquo", "lsquo", "bdquo", "ldquo"]   # German „quotes"

sass:
  style: compressed
  sourcemap: never

plugins:
  - jekyll-archives
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from

feed:
  path: /feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CONTRIBUTING.md
  - LICENSE.txt
  - docker-compose.yml
  - vendor
  - .bundle

# Reading time is calculated, never typed by hand.
words_per_minute: 200
