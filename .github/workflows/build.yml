name: Build & deploy the Journal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/configure-pages@v5

      # Erzeugt die kleineren Bildfassungen, aus denen Jekyll das srcset baut.
      # Läuft vor dem Build, damit die Ordner beim Bauen schon da sind. Die
      # erzeugten Dateien landen nur im Deployment, nicht im Repository — das
      # bleibt dadurch klein.
      - name: Bildgrößen erzeugen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libvips-tools
          bash script/make_image_sizes.sh

      - name: Build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # A broken internal link is invisible until someone reports it, so the
      # build checks its own output before anything is published.
      - name: Check internal links & required metadata
        run: ruby script/check_build.rb

      - uses: actions/upload-pages-artifact@v3

    deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Cloudflare Cache purge
        run: |
          curl --fail-with-body --request POST \
            --url "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            --header "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data '{"hosts":["blog.mellowlight.de", "www.blog.mellowlight.de"]}'